name: Pages deploy check

on:
  push:
    branches: [main]

permissions:
  checks: read
  contents: read

concurrency:
  group: pages-deploy-check
  cancel-in-progress: true

jobs:
  ensure-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the production deployment to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 20); do
            state=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages" and .name == "Cloudflare Pages")] | max_by(.id) | .conclusion // "pending"')
            case "$state" in
              success) exit 0 ;;
              pending) sleep 30 ;;
              *) echo "::error::Cloudflare Pages finished with $state for $SHA"; exit 1 ;;
            esac
          done
          echo "::error::Cloudflare Pages did not complete for $SHA within 10 minutes."
          exit 1

      - name: Check the public routes
        env:
          SITE: https://www.wangyaodi.com
        run: |
          set -euo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          for path in /hire-me /ai-audits; do
            status=$(curl -sS --retry 2 --max-time 20 -o "$body" -w '%{http_code}' "$SITE$path")
            [[ "$status" == 200 ]]
            grep -Fq "rel=\"canonical\" href=\"$SITE$path\"" "$body"
          done
          for path in /vibecare /vibecare.html; do
            status=$(curl -sS --retry 2 --max-time 20 -o /dev/null -w '%{http_code}' "$SITE$path")
            [[ "$status" == 301 || "$status" == 308 ]]
            result=$(curl -sSL --retry 2 --max-time 20 -o /dev/null -w '%{http_code} %{url_effective}' "$SITE$path")
            [[ "$result" == "200 $SITE/ai-audits" ]]
          done
          status=$(curl -sS --retry 2 --max-time 20 -o "$body" -w '%{http_code}' "$SITE/deploy-check-missing-$GITHUB_RUN_ID")
          [[ "$status" == 404 ]]
          grep -Fq 'name="robots" content="noindex"' "$body"
