# Cloudflare Pages deploys main through its GitHub App. If GitHub's push
# notification to Cloudflare goes missing, no build starts and the push never
# reaches production. This job waits for Cloudflare's check run on the pushed
# commit and fails if none appears, so the miss shows up in GitHub Actions.
# Then deploy main by hand:
#   cf pages projects deployments create wangyaodi --branch main
name: Pages deploy check

on:
  push:
    branches: [main]

permissions:
  checks: read
  contents: read

concurrency:
  group: pages-deploy-check
  cancel-in-progress: true

jobs:
  ensure-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Cloudflare Pages to pick up the push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 20); do
            found=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages")] | length')
            if [ "$found" -gt 0 ]; then
              echo "Cloudflare Pages build started for $SHA."
              exit 0
            fi
            sleep 30
          done
          echo "::error::No Cloudflare Pages build for $SHA after 10 minutes. Deploy main by hand: cf pages projects deployments create wangyaodi --branch main"
          exit 1
