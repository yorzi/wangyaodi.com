<link rel="stylesheet" href="card.css">
<style>
  body{ width:1200px; height:630px; }
  .card{
    width:1200px; height:630px;

  .card::before,
  .card::after{ content:""; position:absolute; inset:0; pointer-events:none; }
  .card::before{
    z-index:-2;
    background:url('../../public/assets/bg/shavings.jpg') center 48%/cover no-repeat;
    filter:grayscale(1) contrast(1.05);
  }
  .card::after{
    z-index:-1;
    background:linear-gradient(100deg,
      #f4f1ea 0%,
      rgba(244,241,234,.92) 44%,
      rgba(244,241,234,.58) 100%);
  }
  .main{ margin-top:42px; max-width:780px; }
  h1{ font-size:76px; line-height:1.03; }

<div class="card">
  <div>
    <p class="label">AI &amp; codebase audits</p>
